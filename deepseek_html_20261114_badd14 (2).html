<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Arcade Kart Racer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Arial', sans-serif; }
        #game-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; color: white; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; z-index: 10; }
        .hud-panel { background: rgba(0, 0, 0, 0.5); padding: 10px 20px; border-radius: 10px; border: 2px solid #fff; font-size: 24px; font-weight: bold; }
        #timer { font-size: 32px; color: #FFD700; }
        #item-slot { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; border: 3px solid #fff; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; font-size: 40px; color: white; z-index: 10; display: none; }
        #item-name { position: absolute; top: 190px; left: 50%; transform: translateX(-50%); color: white; font-weight: bold; font-size: 20px; text-shadow: 2px 2px 0 #000; z-index: 10; display: none; }
        #warning { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-size: 48px; font-weight: bold; text-shadow: 3px 3px 0 #fff; display: none; z-index: 20; text-align: center; }
        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 120px; font-weight: bold; text-shadow: 5px 5px 0 #000; z-index: 30; }
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        #menu h1 { font-size: 60px; margin-bottom: 10px; color: #FFD700; text-shadow: 3px 3px 0 #000; }
        #menu p { font-size: 20px; margin-bottom: 30px; }
        .track-btn { padding: 15px 30px; margin: 10px; font-size: 24px; cursor: pointer; background: #333; color: white; border: 2px solid #FFD700; border-radius: 10px; transition: 0.2s; width: 300px; }
        .track-btn:hover { background: #FFD700; color: #000; transform: scale(1.05); }
        .track-btn:disabled { background: #555; border-color: #777; color: #999; cursor: not-allowed; }
        #controls-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; font-size: 16px; z-index: 10; }
        .item-effect { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; color: #fff; text-shadow: 0 0 20px #fff; animation: pop 1s forwards; pointer-events: none; z-index: 25; }
        @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <!-- HUD -->
    <div id="hud">
        <div class="hud-panel" id="rank">POS: 8/8</div>
        <div class="hud-panel" id="timer">02:00</div>
        <div class="hud-panel" id="speed">0 km/h</div>
    </div>
    <div id="item-slot"></div>
    <div id="item-name"></div>
    <div id="warning">OFF TRACK!<br>Return in <span id="warn-timer">5</span>s</div>
    <div id="countdown"></div>

    <!-- Menu -->
    <div id="menu">
        <h1>3D Arcade Kart Racer</h1>
        <p>Select a Track to Begin</p>
        <div id="track-buttons">
            <button class="track-btn" data-track="space">Space (Rainbow Road)</button>
            <button class="track-btn" data-track="city">City (Tokyo)</button>
            <button class="track-btn" data-track="volcano">Volcano</button>
            <button class="track-btn" data-track="underwater">Underwater World</button>
        </div>
    </div>
    
    <div id="controls-hint">WASD to Drive | SHIFT to Drift | R to Restart</div>

    <!-- Three.js Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- GAME CONFIGURATION ---
        const CONFIG = {
            raceTime: 120, // 2 minutes
            racerCount: 8,
            kartSpeed: 40,
            boostSpeed: 70,
            driftMultiplier: 1.2,
            gravity: 30,
            trackWidth: 20
        };

        // --- ITEM DEFINITIONS ---
        const ITEMS = {
            APPLE: { name: 'Apple', icon: '🍎', color: 0xff0000, duration: 8, type: 'invincibility' },
            SWAP: { name: 'Position Swap', icon: '🔄', color: 0x00ffff, duration: 0, type: 'swap' },
            MISSILE: { name: 'Homing Missile', icon: '🚀', color: 0xff5500, duration: 3, type: 'missile' },
            GLOVE: { name: 'Boxing Glove', icon: '🥊', color: 0xff00ff, duration: 5, type: 'glove' },
            MATH: { name: 'Failed Math Test', icon: '💢', color: 0xffaa00, duration: 5, type: 'boost' }
        };

        // --- CHARACTERS ---
        const CHARACTERS = [
            { name: "AKI", color: 0xff4444, type: 'human_f' },
            { name: "KEN", color: 0x4444ff, type: 'human_m' },
            { name: "REI", color: 0x44ffaa, type: 'ghost_f' },
            { name: "KAI", color: 0xaa44ff, type: 'ghost_m' },
            { name: "NPC1", color: 0xffff44, type: 'human_m' },
            { name: "NPC2", color: 0xff44ff, type: 'human_f' },
            { name: "NPC3", color: 0x44ffff, type: 'ghost_m' },
            { name: "NPC4", color: 0xffffff, type: 'ghost_f' }
        ];

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, clock;
        let playerKart, aiKarts = [], itemBoxes = [], projectiles = [];
        let particles = [];
        let trackCurve, trackMesh, trackEdges = [];
        let gameState = 'menu'; // menu, countdown, racing, finished
        let raceTimeLeft = CONFIG.raceTime;
        let playerRank = 8;
        let currentItem = null;
        let invincibilityTimer = 0;
        let boostTimer = 0;
        let gloveTimer = 0;
        let missileTarget = null;
        let outOfBoundsTimer = 0;
        let countdownValue = 3;
        let currentTrackType = 'space';
        
        // Input
        const keys = { w: false, a: false, s: false, d: false, shift: false };

        // --- THREE.JS SETUP ---
        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 50);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 200;
            dirLight.shadow.camera.bottom = -200;
            dirLight.shadow.camera.left = -200;
            dirLight.shadow.camera.right = 200;
            scene.add(dirLight);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', (e) => handleKey(e, true));
            document.addEventListener('keyup', (e) => handleKey(e, false));
            
            // Menu Buttons
            document.querySelectorAll('.track-btn').forEach(btn => {
                btn.addEventListener('click', () => startGame(btn.dataset.track));
            });

            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function handleKey(e, isDown) {
            if (e.key === 'Shift') keys.shift = isDown;
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) keys[key] = isDown;
            if (e.key === 'r' || e.key === 'R') location.reload();
        }

        // --- TRACK GENERATION ---
        function generateTrack(type) {
            // Clear existing track
            if (trackMesh) scene.remove(trackMesh);
            trackEdges.forEach(edge => scene.remove(edge));
            trackEdges = [];

            currentTrackType = type;
            let points = [];
            let trackColor = 0x333333;
            let bgColor = 0x000000;
            let fogColor = 0x000000;

            // Define control points based on track type
            if (type === 'space') {
                // Rainbow Road - Elevated, winding, no rails
                points = [
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(50, 20, -50),
                    new THREE.Vector3(100, 40, -100),
                    new THREE.Vector3(50, 60, -150),
                    new THREE.Vector3(-50, 80, -100),
                    new THREE.Vector3(-100, 40, -50),
                    new THREE.Vector3(-50, 20, 50),
                    new THREE.Vector3(0, 0, 0)
                ];
                trackColor = 0x222222;
                bgColor = 0x000011;
                fogColor = 0x000033;
                scene.background = new THREE.Color(bgColor);
                scene.fog.color.setHex(fogColor);
            } else if (type === 'city') {
                // Tokyo - Tight 90 degree corners
                points = [
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(0, 0, -100),
                    new THREE.Vector3(0, 0, -150), // Turn 1
                    new THREE.Vector3(-100, 0, -150),
                    new THREE.Vector3(-100, 0, -50),
                    new THREE.Vector3(-50, 0, -50), // Hairpin
                    new THREE.Vector3(-50, 0, 50),
                    new THREE.Vector3(50, 0, 50),
                    new THREE.Vector3(50, 0, 0),
                    new THREE.Vector3(0, 0, 0)
                ];
                trackColor = 0x111111;
                bgColor = 0x111122;
                fogColor = 0x111122;
                scene.background = new THREE.Color(bgColor);
                scene.fog.color.setHex(fogColor);
                // Add fake buildings
                for(let i=0; i<50; i++) {
                    const geo = new THREE.BoxGeometry(10 + Math.random()*20, 20 + Math.random()*50, 10 + Math.random()*20);
                    const mat = new THREE.MeshStandardMaterial({color: 0x222244, emissive: 0x0000aa, emissiveIntensity: 0.2});
                    const bldg = new THREE.Mesh(geo, mat);
                    bldg.position.set((Math.random()-0.5)*300, 10, (Math.random()-0.5)*300);
                    scene.add(bldg);
                }
            } else if (type === 'volcano') {
                // Volcano - Sharp, aggressive
                points = [
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(80, 10, -80),
                    new THREE.Vector3(120, 5, -30),
                    new THREE.Vector3(60, 15, 60),
                    new THREE.Vector3(-40, 5, 100),
                    new THREE.Vector3(-100, 10, 0),
                    new THREE.Vector3(-50, 0, -50),
                    new THREE.Vector3(0, 0, 0)
                ];
                trackColor = 0x442222;
                bgColor = 0x220000;
                fogColor = 0x220000;
                scene.background = new THREE.Color(bgColor);
                scene.fog.color.setHex(fogColor);
                // Lava floor
                const floorGeo = new THREE.PlaneGeometry(1000, 1000);
                const floorMat = new THREE.MeshStandardMaterial({color: 0xff4400, emissive: 0xff2200, emissiveIntensity: 0.5});
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -5;
                scene.add(floor);
            } else if (type === 'underwater') {
                // Underwater - Flowy
                points = [
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(60, -10, -60),
                    new THREE.Vector3(100, 0, -120),
                    new THREE.Vector3(20, 10, -150),
                    new THREE.Vector3(-60, 0, -100),
                    new THREE.Vector3(-100, -10, -20),
                    new THREE.Vector3(-50, 0, 60),
                    new THREE.Vector3(0, 0, 0)
                ];
                trackColor = 0x224444;
                bgColor = 0x001122;
                fogColor = 0x001122;
                scene.background = new THREE.Color(bgColor);
                scene.fog.color.setHex(fogColor);
                scene.fog.density = 0.01; // Thicker fog for water
            }

            // Create Curve
            trackCurve = new THREE.CatmullRomCurve3(points, true);

            // Create Track Mesh
            const trackGeo = new THREE.TubeGeometry(trackCurve, 200, CONFIG.trackWidth / 2, 8, true);
            const trackMat = new THREE.MeshStandardMaterial({ 
                color: trackColor, 
                roughness: 0.8,
                metalness: 0.2,
                side: THREE.DoubleSide
            });
            trackMesh = new THREE.Mesh(trackGeo, trackMat);
            trackMesh.receiveShadow = true;
            scene.add(trackMesh);

            // Create Edges (Rails or visual markers)
            if (type !== 'space') { // Space has no guardrails
                const edgeGeo = new THREE.TubeGeometry(trackCurve, 200, 1, 4, true);
                const edgeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x550000 });
                
                // Top edge
                const topEdge = new THREE.Mesh(edgeGeo, edgeMat);
                topEdge.scale.set(1, 1, 1);
                topEdge.position.y = 2;
                scene.add(topEdge);
                trackEdges.push(topEdge);

                // Bottom edge
                const botEdge = new THREE.Mesh(edgeGeo, edgeMat);
                botEdge.position.y = -2;
                scene.add(botEdge);
                trackEdges.push(botEdge);
            } else {
                // Space - add glowing neon strips
                const stripGeo = new THREE.TubeGeometry(trackCurve, 200, 0.5, 4, true);
                const stripMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                const strip1 = new THREE.Mesh(stripGeo, stripMat);
                strip1.position.y = 1;
                scene.add(strip1);
                const strip2 = new THREE.Mesh(stripGeo, stripMat);
                strip2.position.y = -1;
                scene.add(strip2);
            }

            // Add Scenery
            addScenery(type);
        }

        function addScenery(type) {
            // Add random floating objects based on track
            for (let i = 0; i < 50; i++) {
                let geo, mat, pos;
                const t = Math.random();
                const point = trackCurve.getPointAt(t);
                const offset = 30 + Math.random() * 50;
                const angle = Math.random() * Math.PI * 2;
                pos = new THREE.Vector3(
                    point.x + Math.cos(angle) * offset,
                    point.y + (Math.random() - 0.5) * 40,
                    point.z + Math.sin(angle) * offset
                );

                if (type === 'space') {
                    geo = new THREE.IcosahedronGeometry(2 + Math.random() * 5);
                    mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x442200 });
                } else if (type === 'underwater') {
                    geo = new THREE.ConeGeometry(2, 5, 5);
                    mat = new THREE.MeshStandardMaterial({ color: 0x00ffaa });
                } else if (type === 'volcano') {
                    geo = new THREE.DodecahedronGeometry(3);
                    mat = new THREE.MeshStandardMaterial({ color: 0x333333 });
                } else {
                    continue; // City handled separately
                }

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);
            }
        }

        // --- KART CREATION ---
        function createKart(charData, isPlayer = false) {
            const group = new THREE.Group();

            // Chassis
            const chassisGeo = new THREE.BoxGeometry(2, 0.5, 3);
            const chassisMat = new THREE.MeshStandardMaterial({ color: charData.color });
            const chassis = new THREE.Mesh(chassisGeo, chassisMat);
            chassis.castShadow = true;
            chassis.position.y = 0.5;
            group.add(chassis);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const wheelPositions = [[-1.1, 0.5, 1], [1.1, 0.5, 1], [-1.1, 0.5, -1], [1.1, 0.5, -1]];
            
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                group.add(wheel);
            });

            // Driver (Simple representation)
            const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.5;
            head.castShadow = true;
            group.add(head);

            // Helmet/Hair
            const helmGeo = new THREE.SphereGeometry(0.55, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const helmMat = new THREE.MeshStandardMaterial({ color: charData.color });
            const helm = new THREE.Mesh(helmGeo, helmMat);
            helm.position.y = 1.6;
            group.add(helm);

            // Ghost effect
            if (charData.type.includes('ghost')) {
                group.traverse(child => {
                    if (child.isMesh) {
                        child.material.transparent = true;
                        child.material.opacity = 0.7;
                    }
                });
            }

            group.userData = {
                velocity: new THREE.Vector3(),
                speed: 0,
                isDrifting: false,
                driftAngle: 0,
                currentT: 0, // Progress along track (0-1)
                lap: 0,
                targetNode: 0,
                item: null,
                effect: null,
                effectTimer: 0,
                name: charData.name
            };

            return group;
        }

        // --- ITEM SPAWNING ---
        function spawnItemBoxes() {
            itemBoxes.forEach(box => scene.remove(box));
            itemBoxes = [];

            // 3 Item Zones
            const zones = [0.2, 0.5, 0.8];
            
            zones.forEach(t => {
                const point = trackCurve.getPointAt(t);
                const boxGroup = new THREE.Group();
                
                // Create 3 boxes per zone
                for(let i = -1; i <= 1; i++) {
                    const geo = new THREE.BoxGeometry(2, 2, 2);
                    const mat = new THREE.MeshStandardMaterial({ 
                        color: 0xffdd00, 
                        emissive: 0xaa8800,
                        transparent: true,
                        opacity: 0.8
                    });
                    const box = new THREE.Mesh(geo, mat);
                    
                    // Offset across track width
                    const tangent = trackCurve.getTangentAt(t).normalize();
                    const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
                    box.position.copy(point).add(normal.multiplyScalar(i * 6));
                    box.position.y += 2;
                    
                    box.userData = { active: true, respawnTimer: 0 };
                    boxGroup.add(box);
                }
                
                boxGroup.userData = { t: t, point: point };
                scene.add(boxGroup);
                itemBoxes.push(boxGroup);
            });
        }

        // --- GAME START ---
        function startGame(trackType) {
            document.getElementById('menu').style.display = 'none';
            
            // Clear scene
            while(scene.children.length > 0) scene.remove(scene.children[0]);
            
            // Re-add lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Generate Track
            generateTrack(trackType);

            // Reset Variables
            aiKarts = [];
            projectiles = [];
            particles = [];
            raceTimeLeft = CONFIG.raceTime;
            playerRank = 8;
            currentItem = null;
            invincibilityTimer = 0;
            boostTimer = 0;
            gloveTimer = 0;
            outOfBoundsTimer = 0;
            document.getElementById('item-slot').style.display = 'none';
            document.getElementById('item-name').style.display = 'none';
            document.getElementById('warning').style.display = 'none';

            // Spawn Player
            const startPoint = trackCurve.getPointAt(0);
            const startTangent = trackCurve.getTangentAt(0);
            
            playerKart = createKart(CHARACTERS[0], true);
            playerKart.position.copy(startPoint).add(new THREE.Vector3(0, 2, 0));
            playerKart.lookAt(startPoint.clone().add(startTangent));
            scene.add(playerKart);

            // Spawn AI
            for (let i = 1; i < CONFIG.racerCount; i++) {
                const ai = createKart(CHARACTERS[i % CHARACTERS.length], false);
                const offsetT = (i * 0.02); // Spread out slightly
                const aiPoint = trackCurve.getPointAt(offsetT);
                ai.position.copy(aiPoint).add(new THREE.Vector3((Math.random()-0.5)*10, 2, (Math.random()-0.5)*10));
                ai.lookAt(aiPoint.clone().add(trackCurve.getTangentAt(offsetT)));
                ai.userData.currentT = offsetT;
                scene.add(ai);
                aiKarts.push(ai);
            }

            // Spawn Items
            spawnItemBoxes();

            // Start Countdown
            gameState = 'countdown';
            countdownValue = 3;
            document.getElementById('countdown').style.display = 'block';
            document.getElementById('countdown').innerText = countdownValue;
            
            setTimeout(() => {
                countdownValue = 2;
                document.getElementById('countdown').innerText = countdownValue;
            }, 1000);
            setTimeout(() => {
                countdownValue = 1;
                document.getElementById('countdown').innerText = countdownValue;
            }, 2000);
            setTimeout(() => {
                document.getElementById('countdown').innerText = "GO!";
                gameState = 'racing';
                setTimeout(() => {
                    document.getElementById('countdown').style.display = 'none';
                }, 500);
            }, 3000);
        }

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (gameState === 'racing') {
                updateRace(delta);
            } else if (gameState === 'finished') {
                // Do nothing, or idle
            }

            renderer.render(scene, camera);
        }

        function updateRace(delta) {
            // Timer
            raceTimeLeft -= delta;
            if (raceTimeLeft <= 0) {
                raceTimeLeft = 0;
                gameState = 'finished';
                alert("Race Finished!");
            }
            
            const mins = Math.floor(raceTimeLeft / 60).toString().padStart(2, '0');
            const secs = Math.floor(raceTimeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;

            // Update Player
            if (playerKart) {
                handlePlayerMovement(delta);
                updatePlayerEffects(delta);
                checkItemPickup(playerKart);
            }

            // Update AI
            aiKarts.forEach(ai => {
                handleAIMovement(ai, delta);
                updatePlayerEffects(ai);
                checkItemPickup(ai);
            });

            // Update Projectiles
            updateProjectiles(delta);

            // Update Particles
            updateParticles(delta);

            // Check Item Box Respawns
            itemBoxes.forEach(group => {
                group.children.forEach(box => {
                    if (!box.userData.active) {
                        box.userData.respawnTimer -= delta;
                        if (box.userData.respawnTimer <= 0) {
                            box.userData.active = true;
                            box.visible = true;
                        }
                    }
                });
            });

            // Update Rank
            updateRank();

            // Camera Follow
            updateCamera(delta);
        }

        // --- PLAYER MOVEMENT ---
        function handlePlayerMovement(delta) {
            const kart = playerKart;
            
            // Acceleration
            let accel = 0;
            if (keys.w) accel += 30;
            if (keys.s) accel -= 20;
            
            // Boost override
            if (boostTimer > 0) accel = 50;
            
            kart.userData.speed += accel * delta;
            
            // Friction
            kart.userData.speed *= 0.98;
            
            // Max Speed
            const maxSpeed = boostTimer > 0 ? CONFIG.boostSpeed : CONFIG.kartSpeed;
            if (kart.userData.speed > maxSpeed) kart.userData.speed = maxSpeed;
            if (kart.userData.speed < -10) kart.userData.speed = -10;

            // Steering
            let steer = 0;
            if (keys.a) steer = 1;
            if (keys.d) steer = -1;

            // Drifting
            if (keys.shift && kart.userData.speed > 10) {
                kart.userData.isDrifting = true;
                steer *= 1.5; // Sharper turn
                kart.userData.speed *= 0.99; // Slight speed loss
            } else {
                kart.userData.isDrifting = false;
            }

            // Apply movement
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(kart.quaternion);
            kart.position.add(forward.multiplyScalar(kart.userData.speed * delta));

            // Apply rotation
            kart.rotateY(steer * delta * 2.5);

            // Tilt for visual flair
            if (kart.userData.isDrifting) {
                kart.rotation.z = -steer * 0.2;
            } else {
                kart.rotation.z = THREE.MathUtils.lerp(kart.rotation.z, 0, 0.1);
            }

            // Track progress calculation
            updateKartProgress(kart, delta);

            // Out of bounds check
            const closestPoint = trackCurve.getPointAt(kart.userData.currentT);
            const dist = kart.position.distanceTo(closestPoint);
            
            if (dist > CONFIG.trackWidth + 5) {
                outOfBoundsTimer += delta;
                document.getElementById('warning').style.display = 'block';
                document.getElementById('warn-timer').innerText = Math.ceil(5 - outOfBoundsTimer);
                
                if (outOfBoundsTimer >= 5) {
                    // Respawn
                    kart.position.copy(closestPoint).add(new THREE.Vector3(0, 2, 0));
                    kart.userData.speed = 0;
                    outOfBoundsTimer = 0;
                    document.getElementById('warning').style.display = 'none';
                }
            } else {
                outOfBoundsTimer = 0;
                document.getElementById('warning').style.display = 'none';
            }

            // Speed Display
            document.getElementById('speed').innerText = `${Math.floor(Math.abs(kart.userData.speed * 2))} km/h`;
        }

        // --- AI MOVEMENT ---
        function handleAIMovement(kart, delta) {
            const t = kart.userData.currentT;
            const lookAhead = 0.02;
            const targetT = (t + lookAhead) % 1;
            const targetPoint = trackCurve.getPointAt(targetT);
            
            // Move towards target point
            const direction = targetPoint.clone().sub(kart.position).normalize();
            kart.position.add(direction.multiplyScalar(25 * delta));
            
            // Rotate to face direction
            const quaternion = new THREE.Quaternion().setFromUnitVectors(
                new THREE.Vector3(0, 0, -1),
                direction
            );
            kart.quaternion.slerp(quaternion, 0.1);

            // Update progress
            kart.userData.currentT = targetT;

            // Random AI item usage
            if (kart.userData.item && Math.random() < 0.01) {
                useItem(kart);
            }
        }

        // --- PROGRESS TRACKING ---
        function updateKartProgress(kart, delta) {
            // Find nearest point on curve
            let minDist = Infinity;
            let nearestT = kart.userData.currentT;
            
            // Check nearby segments for efficiency
            for (let i = -5; i <= 5; i++) {
                const checkT = (kart.userData.currentT + i * 0.01 + 1) % 1;
                const point = trackCurve.getPointAt(checkT);
                const dist = kart.position.distanceTo(point);
                if (dist < minDist) {
                    minDist = dist;
                    nearestT = checkT;
                }
            }
            
            // Handle lap counting
            if (nearestT < 0.1 && kart.userData.currentT > 0.9) {
                kart.userData.lap++;
            }
            kart.userData.currentT = nearestT;
        }

        // --- RANKING SYSTEM ---
        function updateRank() {
            const racers = [playerKart, ...aiKarts];
            
            // Calculate total progress (lap + t)
            racers.forEach(k => {
                k.userData.totalProgress = k.userData.lap + k.userData.currentT;
            });

            // Sort descending
            racers.sort((a, b) => b.userData.totalProgress - a.userData.totalProgress);
            
            playerRank = racers.indexOf(playerKart) + 1;
            document.getElementById('rank').innerText = `POS: ${playerRank}/8`;
        }

        // --- CAMERA ---
        function updateCamera(delta) {
            if (!playerKart) return;
            
            const relativeOffset = new THREE.Vector3(0, 8, 15);
            const targetPos = relativeOffset.clone().applyQuaternion(playerKart.quaternion).add(playerKart.position);
            
            camera.position.lerp(targetPos, 0.1);
            
            const lookAtPos = playerKart.position.clone().add(new THREE.Vector3(0, 2, 0));
            camera.lookAt(lookAtPos);
        }

        // --- ITEM SYSTEM ---
        function checkItemPickup(kart) {
            if (kart.userData.item) return; // Already has item

            itemBoxes.forEach(group => {
                group.children.forEach(box => {
                    if (box.userData.active) {
                        const dist = kart.position.distanceTo(box.position);
                        if (dist < 3) {
                            // Pickup!
                            box.userData.active = false;
                            box.visible = false;
                            box.userData.respawnTimer = 3; // Respawn in 3s
                            
                            if (kart === playerKart) {
                                giveRandomItem(kart);
                            } else {
                                // AI gets random item
                                const itemKeys = Object.keys(ITEMS);
                                const randItem = ITEMS[itemKeys[Math.floor(Math.random() * itemKeys.length)]];
                                kart.userData.item = randItem;
                            }
                        }
                    }
                });
            });
        }

        function giveRandomItem(kart) {
            const roll = Math.random();
            let item;
            
            // Drop rates: Common (Glove, Math) 70%, Uncommon (Missile) 20%, Rare (Apple, Swap) 10%
            if (roll < 0.35) {
                item = ITEMS.GLOVE;
            } else if (roll < 0.70) {
                item = ITEMS.MATH;
            } else if (roll < 0.90) {
                item = ITEMS.MISSILE;
            } else if (roll < 0.95) {
                item = ITEMS.APPLE;
            } else {
                item = ITEMS.SWAP;
            }

            kart.userData.item = item;
            
            if (kart === playerKart) {
                currentItem = item;
                document.getElementById('item-slot').style.display = 'flex';
                document.getElementById('item-slot').innerText = item.icon;
                document.getElementById('item-name').style.display = 'block';
                document.getElementById('item-name').innerText = item.name;
            }
        }

        function useItem(kart) {
            if (!kart.userData.item) return;

            const item = kart.userData.item;
            
            if (kart === playerKart) {
                // Create visual cue
                const cue = document.createElement('div');
                cue.className = 'item-effect';
                cue.innerText = item.icon;
                document.body.appendChild(cue);
                setTimeout(() => cue.remove(), 1000);
                
                // Clear HUD
                document.getElementById('item-slot').style.display = 'none';
                document.getElementById('item-name').style.display = 'none';
                currentItem = null;
            }

            // Apply Effect
            if (item.type === 'invincibility') {
                kart.userData.effect = 'invincible';
                kart.userData.effectTimer = item.duration;
                kart.traverse(child => {
                    if (child.isMesh) {
                        child.material.emissive = new THREE.Color(0xffff00);
                        child.material.emissiveIntensity = 1;
                    }
                });
            } else if (item.type === 'boost') {
                kart.userData.effect = 'boost';
                kart.userData.effectTimer = item.duration;
                boostTimer = item.duration;
                // Add flames
                const flameGeo = new THREE.ConeGeometry(0.5, 2, 8);
                const flameMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
                const flame = new THREE.Mesh(flameGeo, flameMat);
                flame.rotation.x = Math.PI / 2;
                flame.position.set(0, 0.5, 2);
                kart.add(flame);
                kart.userData.flameMesh = flame;
            } else if (item.type === 'swap') {
                // Swap with someone ahead
                const racers = [playerKart, ...aiKarts].sort((a,b) => b.userData.totalProgress - a.userData.totalProgress);
                const myIndex = racers.indexOf(kart);
                if (myIndex > 0) {
                    const target = racers[myIndex - 1]; // One position ahead
                    const myT = kart.userData.currentT;
                    const myLap = kart.userData.lap;
                    kart.userData.currentT = target.userData.currentT;
                    kart.userData.lap = target.userData.lap;
                    target.userData.currentT = myT;
                    target.userData.lap = myLap;
                    
                    // Visual
                    const vortex = new THREE.Mesh(
                        new THREE.TorusGeometry(2, 0.5, 16, 100),
                        new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 })
                    );
                    vortex.position.copy(kart.position);
                    scene.add(vortex);
                    setTimeout(() => scene.remove(vortex), 500);
                }
            } else if (item.type === 'missile') {
                // Fire projectile
                const missile = new THREE.Mesh(
                    new THREE.ConeGeometry(0.5, 2, 8),
                    new THREE.MeshStandardMaterial({ color: 0xff0000 })
                );
                missile.rotation.x = Math.PI / 2;
                missile.position.copy(kart.position);
                missile.userData = {
                    owner: kart,
                    speed: 60,
                    lifetime: 3
                };
                scene.add(missile);
                projectiles.push(missile);
            } else if (item.type === 'glove') {
                kart.userData.effect = 'glove';
                kart.userData.effectTimer = item.duration;
                // Visual glove
                const glove = new THREE.Mesh(
                    new THREE.SphereGeometry(1.5, 8, 8),
                    new THREE.MeshStandardMaterial({ color: 0xff00ff })
                );
                glove.position.set(0, 1, -3);
                kart.add(glove);
                kart.userData.gloveMesh = glove;
            }

            kart.userData.item = null;
        }

        function updatePlayerEffects(kart, delta) {
            if (kart.userData.effectTimer > 0) {
                kart.userData.effectTimer -= delta;
                
                if (kart.userData.effectTimer <= 0) {
                    // Remove effect
                    kart.userData.effect = null;
                    if (kart.userData.flameMesh) {
                        kart.remove(kart.userData.flameMesh);
                        kart.userData.flameMesh = null;
                        boostTimer = 0;
                    }
                    if (kart.userData.gloveMesh) {
                        kart.remove(kart.userData.gloveMesh);
                        kart.userData.gloveMesh = null;
                    }
                    kart.traverse(child => {
                        if (child.isMesh && child.material.emissive) {
                            child.material.emissive = new THREE.Color(0x000000);
                        }
                    });
                }
            }

            // Glove collision check
            if (kart.userData.effect === 'glove') {
                const others = [playerKart, ...aiKarts].filter(k => k !== kart);
                others.forEach(other => {
                    const dist = kart.position.distanceTo(other.position);
                    if (dist < 5) {
                        // Knockback
                        const dir = other.position.clone().sub(kart.position).normalize();
                        other.position.add(dir.multiplyScalar(5));
                        other.userData.speed *= 0.5;
                        
                        // Visual hit
                        const hit = new THREE.Mesh(
                            new THREE.SphereGeometry(2, 8, 8),
                            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })
                        );
                        hit.position.copy(other.position);
                        scene.add(hit);
                        setTimeout(() => scene.remove(hit), 200);
                    }
                });
            }
        }

        // --- PROJECTILES ---
        function updateProjectiles(delta) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.userData.lifetime -= delta;
                
                if (p.userData.lifetime <= 0) {
                    scene.remove(p);
                    projectiles.splice(i, 1);
                    continue;
                }

                // Find nearest target ahead
                const racers = [playerKart, ...aiKarts].filter(k => k !== p.userData.owner);
                let target = null;
                let minDist = Infinity;

                racers.forEach(k => {
                    const dist = p.position.distanceTo(k.position);
                    // Check if roughly ahead
                    if (dist < 100 && dist < minDist) {
                        minDist = dist;
                        target = k;
                    }
                });

                if (target) {
                    const dir = target.position.clone().sub(p.position).normalize();
                    p.position.add(dir.multiplyScalar(p.userData.speed * delta));
                    
                    // Rotate missile
                    p.lookAt(target.position);

                    // Hit check
                    if (p.position.distanceTo(target.position) < 3) {
                        // Explosion
                        const explo = new THREE.Mesh(
                            new THREE.SphereGeometry(5, 16, 16),
                            new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.8 })
                        );
                        explo.position.copy(p.position);
                        scene.add(explo);
                        setTimeout(() => scene.remove(explo), 300);

                        // Spin out target
                        target.userData.speed = 0;
                        target.rotation.y += Math.PI;

                        scene.remove(p);
                        projectiles.splice(i, 1);
                    }
                } else {
                    // Move forward
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(p.quaternion);
                    p.position.add(forward.multiplyScalar(p.userData.speed * delta));
                }
            }
        }

        // --- PARTICLES ---
        function updateParticles(delta) {
            // Simple particle system for drift trails etc.
            // Currently handled visually by tilt/effects
        }

        // --- INIT & START ---
        init();

    </script>
